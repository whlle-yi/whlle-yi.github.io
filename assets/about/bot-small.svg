<svg class="pixel-robot" viewBox="0 0 96 96" aria-hidden="true"><g class="bot-float">
<ellipse class="bot-shadow" cx="48" cy="91" rx="14" ry="2.6" fill="#27272a" opacity="0.16"/>
<!-- 天线:二十面体顶点延伸 -->
<g class="bot-antenna">
<line x1="48" y1="11" x2="48" y2="5.5" stroke="#1e4e78" stroke-width="1.4"/>
<circle cx="48" cy="4.4" r="2.2" fill="#e0475c"/>
</g>
<!-- 头部:二十面体投影(与背景几何体同款) -->
<polygon points="48,11 31.5,20.5 31.5,39.5 48,49 64.5,39.5 64.5,20.5" fill="#2e6a9c" stroke="#1e4e78" stroke-width="1.4"/>
<g stroke="#7fb3d8" stroke-width="0.9" opacity="0.55">
<line x1="48" y1="11" x2="48" y2="30"/><line x1="31.5" y1="20.5" x2="48" y2="30"/><line x1="31.5" y1="39.5" x2="48" y2="30"/><line x1="48" y1="49" x2="48" y2="30"/><line x1="64.5" y1="39.5" x2="48" y2="30"/><line x1="64.5" y1="20.5" x2="48" y2="30"/>
</g>
<!-- 面罩与眼睛 -->
<rect x="37.5" y="22.5" width="21" height="15" rx="4" fill="#173a5c" stroke="#1e4e78" stroke-width="0.8"/>
<circle class="bot-blink" cx="43.5" cy="30" r="2.4" fill="#ff7d8d"/>
<circle class="bot-blink" cx="52.5" cy="30" r="2.4" fill="#ff7d8d"/>
<!-- 颈 + 躯干 -->
<rect x="43.5" y="49" width="9" height="4.5" fill="#1e4e78"/>
<rect x="37" y="53.5" width="22" height="19" rx="5" fill="#2e6a9c" stroke="#1e4e78" stroke-width="1.3"/>
<rect x="41.5" y="58.5" width="13" height="9" rx="2.5" fill="none" stroke="#7fb3d8" stroke-width="0.8" opacity="0.6"/>
<circle class="bot-core" cx="48" cy="63" r="2.2" fill="#e0475c"/>
<!-- 悬浮双臂 -->
<g class="bot-arm-l">
<line x1="37" y1="57.5" x2="29.5" y2="66" stroke="#1e4e78" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="28.5" cy="67.5" r="2.8" fill="#2e6a9c" stroke="#1e4e78" stroke-width="1.2"/>
</g>
<g class="bot-arm-r">
<line x1="59" y1="57.5" x2="66.5" y2="66" stroke="#1e4e78" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="67.5" cy="67.5" r="2.8" fill="#2e6a9c" stroke="#1e4e78" stroke-width="1.2"/>
</g>
<!-- 悬浮推进微光 -->
<ellipse cx="48" cy="77.5" rx="5" ry="1.8" fill="#7fb3d8" opacity="0.35"/>
</g></svg>
