sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Personal site
  title_lines:
    - words: [{ text: What I build, }]
    - words: [{ text: explained clearly. }]
  lead: Articles, projects, and notes — written down in one place.
  actions:
    - { label: About me, url: about/, icon: fa-solid fa-user, style: primary }
    - { label: Browse projects, url: case/, icon: fa-solid fa-layer-group, style: ghost }

cards:
  eyebrow: Three entrances
  title: Start where you like
  columns: 3
  items:
    - title: About
      desc: Who I am, what I can do, and what I am working on.
      icon: fa-solid fa-user
      url: about/
    - title: Blog
      desc: Ideas, notes, and build logs.
      icon: fa-solid fa-pen-nib
      url: blog/
    - title: Projects
      desc: Things I have built, with source and write-ups.
      icon: fa-solid fa-layer-group
      url: case/

cta:
  title: Say hello.
  text: The fastest way to reach me is GitHub.
  label: GitHub
  url: https://github.com/whlle-yi
  style: primary
